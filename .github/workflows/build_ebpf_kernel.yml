name: Build Samsung S8+ eBPF Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Local Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies & 32-bit Compatibility Libs
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y build-essential libncurses5 bzip2 libssl-dev bc \
          flex bison libelf-dev git lzop ccache zip python3 python2 curl \
          libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1

    - name: Download Google Android Prebuilts Toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-aarch64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain-arm32

    - name: Fix DTC Lexer yylloc Multiple Definition
      run: |
        # Fix legacy DTC yylloc bug for modern GCC host
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true

    - name: Inject eBPF & Kprobe Configs
      run: |
        TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1)
        echo "Injecting into: $TARGET_DEFCONFIG"
        cat << 'EOF' >> $TARGET_DEFCONFIG
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_HAVE_EBPF_JIT=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_UPROBES=y
        CONFIG_UPROBE_EVENTS=y
        CONFIG_PERF_EVENTS=y
        CONFIG_BPF_EVENTS=y
        CONFIG_NET_CLS_ACT=y
        CONFIG_NET_SCH_INGRESS=y
        CONFIG_NET_CLS_BPF=y
        CONFIG_NET_ACT_BPF=y
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        EOF

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain-aarch64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain-arm32/bin/arm-linux-androideabi-
        export HOSTCFLAGS="-fcommon"
        export HOSTCXXFLAGS="-fcommon"

        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1))
        echo "Building defconfig: $DEFCONFIG_NAME..."

        make HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" $DEFCONFIG_NAME
        make HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" -j$(nproc)

    - name: Upload Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: s8_plus_ebpf_kernel_google_gcc
        path: arch/arm64/boot/Image
