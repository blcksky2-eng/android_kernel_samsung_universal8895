name: Build Samsung S8+ eBPF Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Local Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies & Cross Compilers
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5 bzip2 libssl-dev bc \
          flex bison libelf-dev git lzop ccache zip python3 python2 curl \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Inject eBPF & Kprobe Configs
      run: |
        TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1)
        echo "Injecting into defconfig: $TARGET_DEFCONFIG"
        cat << 'EOF' >> $TARGET_DEFCONFIG
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_HAVE_EBPF_JIT=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_UPROBES=y
        CONFIG_UPROBE_EVENTS=y
        CONFIG_PERF_EVENTS=y
        CONFIG_BPF_EVENTS=y
        CONFIG_NET_CLS_ACT=y
        CONFIG_NET_SCH_INGRESS=y
        CONFIG_NET_CLS_BPF=y
        CONFIG_NET_ACT_BPF=y
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        EOF

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export HOSTCFLAGS="-fcommon"
        export HOSTCXXFLAGS="-fcommon"

        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1))
        echo "Building defconfig: $DEFCONFIG_NAME..."

        make HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" $DEFCONFIG_NAME
        make HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" -j$(nproc)

    - name: Upload Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: s8_plus_ebpf_kernel
        path: arch/arm64/boot/Image
