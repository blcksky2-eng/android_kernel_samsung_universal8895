name: Build Samsung S8+ eBPF Kernel (Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Local Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5 bzip2 libssl-dev bc \
          flex bison libelf-dev git lzop ccache zip python3 python2 curl

    - name: Download Google Android Clang & GCC Toolchains
      run: |
        # Download Google's official Android Clang 11.0.2 (r383902b1)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release clang
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-aarch64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain-arm32

    - name: Inject eBPF & Kprobe Configs
      run: |
        TARGET_DEFCONFIG=$(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1)
        echo "Configuring: $TARGET_DEFCONFIG"
        cat << 'EOF' >> $TARGET_DEFCONFIG
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_HAVE_EBPF_JIT=y
        CONFIG_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_UPROBES=y
        CONFIG_UPROBE_EVENTS=y
        CONFIG_PERF_EVENTS=y
        CONFIG_BPF_EVENTS=y
        CONFIG_NET_CLS_ACT=y
        CONFIG_NET_SCH_INGRESS=y
        CONFIG_NET_CLS_BPF=y
        CONFIG_NET_ACT_BPF=y
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        EOF

    - name: Compile Kernel & DTBs with Android Clang
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=$(pwd)/clang/clang-r383902b1/bin/clang
        export CROSS_COMPILE=$(pwd)/toolchain-aarch64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain-arm32/bin/arm-linux-androideabi-
        export PATH=$(pwd)/clang/clang-r383902b1/bin:$(pwd)/toolchain-aarch64/bin:$PATH

        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs/ -name "*dream2lte*" | head -n 1))
        make $DEFCONFIG_NAME
        make -j$(nproc)

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: s8_plus_ebpf_kernel_clang
        path: arch/arm64/boot/Image
